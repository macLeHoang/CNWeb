services:
  - type: web
    name: ex3-rbac-20251295m
    runtime: node
    plan: free
    rootDir: Ex3-20251295M-LeMinhHoang/backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 3600
      - key: CORS_ORIGINS
        value: https://maclehoang.github.io
