<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Người dùng &amp; Phân quyền</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{min-height:40px;padding:8px 13px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#263244;cursor:pointer}button:hover:not(:disabled){background:#f1f5f9}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:1px}button.primary{border-color:#16794b;background:#16794b;color:#fff}button.primary:hover:not(:disabled){background:#11613c}button.danger{border-color:#dc2626;color:#b91c1c}button:disabled{opacity:.5;cursor:not-allowed}.container{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 56px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.header h1{margin:0 0 7px;font-size:clamp(22px,3vw,32px)}.muted{color:#64748b;font-size:14px}.tabs{display:flex;gap:5px;border-bottom:2px solid #dbe3ee;margin-bottom:18px}.tabs button{border:0;border-radius:8px 8px 0 0}.tabs button.active{background:#16794b;color:#fff}.card{border:1px solid #dbe3ee;border-radius:12px;background:#fff;box-shadow:0 8px 26px rgba(30,41,59,.06)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:15px;border-bottom:1px solid #e2e8f0}.toolbar input{flex:1 1 250px}.toolbar input,.toolbar select,.form-field input,.form-field textarea{min-height:42px;padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:12px 14px;border-bottom:1px solid #e8edf4;text-align:left;vertical-align:middle}th{background:#f8fafc;color:#475569;font-size:13px;text-transform:uppercase;letter-spacing:.035em}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 8px;margin:2px;border-radius:999px;background:#e0efff;color:#14579b;font-size:12px}.badge.active{background:#dcfce7;color:#166534}.badge.locked{background:#fee2e2;color:#991b1b}.badge.system{background:#ffedd5;color:#9a3412}.pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px}.pagination-controls{display:flex;align-items:center;gap:8px}.login-shell{min-height:calc(100vh - 60px);display:grid;place-items:center}.login{width:min(430px,100%);padding:30px}.login h1{margin:0 0 8px}.login .lead{margin:0 0 22px;color:#64748b}.form-field{display:grid;gap:6px;margin-bottom:14px}.form-field label{font-weight:650}.field-error,.error{color:#b91c1c;font-size:13px}.error-banner{padding:10px 12px;border-radius:8px;background:#fee2e2;color:#991b1b}.modal-overlay{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.55)}.modal-content{width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px;background:#fff;box-shadow:0 28px 80px rgba(15,23,42,.3)}.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.modal-header h2{margin:0;font-size:21px}.icon-button{width:42px;padding:0;font-size:22px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.check{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-weight:400}.check input{margin-top:4px}.permission-group{padding:10px 0;border-top:1px solid #e2e8f0}.permission-group h4{margin:0 0 5px;text-transform:capitalize}.toast{position:fixed;z-index:50;right:16px;bottom:16px;max-width:420px;padding:13px 16px;border-radius:9px;color:#fff;box-shadow:0 12px 35px rgba(15,23,42,.25)}.toast.success{background:#16794b}.toast.error{background:#b91c1c}.profile{padding:22px}.profile dl{display:grid;grid-template-columns:160px 1fr;gap:12px;margin:0}.profile dt{font-weight:700}.profile dd{margin:0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-title h2{margin:0}.empty{text-align:center;color:#64748b;padding:28px}.loading{padding:40px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:768px){.container{width:min(100% - 20px,1180px);padding-top:16px}.header{align-items:flex-start}.tabs{overflow-x:auto}.tabs button{white-space:nowrap;min-width:96px}th,td{padding:10px;font-size:13px}.modal-overlay{padding:10px}.modal-content{width:95%;padding:17px}button{min-height:44px}.profile dl{grid-template-columns:1fr;gap:4px}.profile dd{margin-bottom:10px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useState,useEffect,useCallback,useRef}=React;
    const API_BASE="http://localhost:3001/api/v1";
    const TOKEN_KEY="rbac_token";
    const getToken=()=>sessionStorage.getItem(TOKEN_KEY);
    const setToken=(token)=>token?sessionStorage.setItem(TOKEN_KEY,token):sessionStorage.removeItem(TOKEN_KEY);
    const can=(me,permission)=>!!me&&me.permissions.includes(permission);
    const sameId=(a,b)=>String(a)===String(b);
    const api=axios.create({baseURL:API_BASE,timeout:10000});
    api.interceptors.request.use((config)=>{const token=getToken();if(token)config.headers.Authorization=`Bearer ${token}`;return config;});
    api.interceptors.response.use((response)=>response,(error)=>{
      if(!error.response)return Promise.reject({status:0,code:"NETWORK_ERROR",details:[],message:error.code==="ECONNABORTED"?"Máy chủ phản hồi quá lâu.":"Không kết nối được máy chủ (kiểm tra server, mạng hoặc CORS)."});
      const {status,data}=error.response;const normalized={status,code:data?.error?.code||`HTTP_${status}`,message:data?.error?.message||`Lỗi ${status}`,details:data?.error?.details||[]};
      if(status===401&&!error.config.url.endsWith("/auth/tokens")){setToken(null);window.dispatchEvent(new Event("auth:expired"));}
      if(status===403)window.dispatchEvent(new Event("auth:forbidden"));
      return Promise.reject(normalized);
    });

    function Modal({title,onClose,children}){useEffect(()=>{const fn=(event)=>event.key==="Escape"&&onClose();document.addEventListener("keydown",fn);return()=>document.removeEventListener("keydown",fn)},[onClose]);return <div className="modal-overlay" onMouseDown={(event)=>event.target===event.currentTarget&&onClose()}><section className="modal-content" role="dialog" aria-modal="true"><div className="modal-header"><h2>{title}</h2><button className="icon-button" onClick={onClose} aria-label="Đóng">×</button></div>{children}</section></div>}
    function Pagination({meta,limit,onPageChange,onLimitChange}){return <div className="pagination"><div>Hiển thị <select value={limit} onChange={(e)=>onLimitChange(Number(e.target.value))}>{[5,10,20].map(n=><option key={n}>{n}</option>)}</select> dòng · Tổng {meta.totalItems}</div><div className="pagination-controls"><button disabled={meta.page<=1} onClick={()=>onPageChange(meta.page-1)}>Trước</button><span>Trang {meta.page}/{meta.totalPages}</span><button disabled={meta.page>=meta.totalPages} onClick={()=>onPageChange(meta.page+1)}>Sau</button></div></div>}
    function LoginPage({onLoggedIn}){const[form,setForm]=useState({email:"",password:""});const[error,setError]=useState("");const[loading,setLoading]=useState(false);const submit=async(e)=>{e.preventDefault();if(!form.email.trim()||!form.password)return setError("Vui lòng nhập email và mật khẩu.");setLoading(true);setError("");try{const{data}=await api.post("/auth/tokens",{grantType:"password",email:form.email.trim(),password:form.password});setToken(data.accessToken);await onLoggedIn()}catch(err){setToken(null);setError(err.message)}finally{setLoading(false)}};return <div className="login-shell"><form className="login card" onSubmit={submit}><h1>Đăng nhập</h1><p className="lead">Hệ thống quản lý người dùng và phân quyền RBAC</p><div className="form-field"><label htmlFor="email">Email</label><input id="email" type="email" autoComplete="username" value={form.email} onChange={(e)=>setForm({...form,email:e.target.value})}/></div><div className="form-field"><label htmlFor="password">Mật khẩu</label><input id="password" type="password" autoComplete="current-password" value={form.password} onChange={(e)=>setForm({...form,password:e.target.value})}/></div>{error&&<p className="error-banner">{error}</p>}<button className="primary" type="submit" disabled={loading}>{loading?"Đang đăng nhập…":"Đăng nhập"}</button></form></div>}
    function SearchBar({onSearch}){const[value,setValue]=useState("");useEffect(()=>{const timer=setTimeout(()=>onSearch(value),400);return()=>clearTimeout(timer)},[value,onSearch]);return <><label className="sr-only" htmlFor="search">Tìm người dùng</label><input id="search" type="search" placeholder="Tìm theo họ tên, email (tối thiểu 2 ký tự)…" value={value} onChange={(e)=>setValue(e.target.value)}/></>}
    function UserTable({users,me,offset,onEdit,onAssign,onToggleLock,onDelete}){return <div className="table-wrap"><table><thead><tr><th>STT</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>{users.length===0?<tr><td colSpan="6" className="empty">Không có dữ liệu</td></tr>:users.map((user,index)=>{const self=sameId(user.id,me.id);return <tr key={user.id}><td>{offset+index+1}</td><td>{user.fullName}{self&&" (bạn)"}</td><td>{user.email}</td><td>{user.roles.map(role=><span className="badge" key={role.id}>{role.name}</span>)}</td><td><span className={`badge ${user.status}`}>{user.status==="locked"?"Đã khóa":"Hoạt động"}</span></td><td><div className="actions">{can(me,"users:update")&&<button onClick={()=>onEdit(user)}>Sửa</button>}{can(me,"roles:assign")&&can(me,"roles:read")&&<button onClick={()=>onAssign(user)}>Vai trò</button>}{can(me,"users:update")&&<button disabled={self} onClick={()=>onToggleLock(user)}>{user.status==="locked"?"Mở khóa":"Khóa"}</button>}{can(me,"users:delete")&&<button className="danger" disabled={self} onClick={()=>onDelete(user)}>Xóa</button>}</div></td></tr>})}</tbody></table></div>}
    function UserModal({user,roles,me,notify,onClose,onSaved}){const isNew=!user;const[form,setForm]=useState({email:user?.email||"",fullName:user?.fullName||"",phone:user?.phone||"",password:"",roleIds:[]});const[errors,setErrors]=useState({});const[saving,setSaving]=useState(false);const change=(key,value)=>{setForm({...form,[key]:value});if(errors[key])setErrors({...errors,[key]:""})};const validate=()=>{const next={};if(!/^\S+@\S+\.\S+$/.test(form.email.trim()))next.email="Email không hợp lệ.";if(form.fullName.trim().length<2)next.fullName="Họ tên phải có ít nhất 2 ký tự.";if(form.phone.trim()&&!/^\+[1-9]\d{7,14}$/.test(form.phone.trim()))next.phone="Số điện thoại phải theo định dạng E.164.";if(isNew&&!/^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(form.password))next.password="Tối thiểu 8 ký tự, có chữ hoa, chữ số và ký tự đặc biệt.";setErrors(next);return !Object.keys(next).length};const submit=async(e)=>{e.preventDefault();if(!validate())return;setSaving(true);const clean={email:form.email.trim().toLowerCase(),fullName:form.fullName.trim(),phone:form.phone.trim()||null};try{if(isNew)await api.post("/users",{...clean,password:form.password,...(form.roleIds.length?{roleIds:form.roleIds}:{})});else{const changed=Object.fromEntries(Object.entries(clean).filter(([key,value])=>value!==(user[key]??null)));if(Object.keys(changed).length)await api.patch(`/users/${user.id}`,changed)}notify("success",isNew?"Tạo người dùng thành công.":"Cập nhật người dùng thành công.");onSaved()}catch(err){const next={};err.details.forEach(item=>{if(item.field)next[item.field]=item.message});if(err.code==="EMAIL_ALREADY_EXISTS")next.email=err.message;setErrors(next);if(!Object.keys(next).length)notify("error",err.message)}finally{setSaving(false)}};const toggleRole=(id)=>change("roleIds",form.roleIds.includes(id)?form.roleIds.filter(item=>item!==id):[...form.roleIds,id]);return <Modal title={isNew?"Thêm người dùng":"Sửa người dùng"} onClose={onClose}><form onSubmit={submit}>{[["email","Email *","email"],["fullName","Họ tên *","text"],["phone","Số điện thoại","tel"]].map(([key,label,type])=><div className="form-field" key={key}><label htmlFor={`user-${key}`}>{label}</label><input id={`user-${key}`} type={type} value={form[key]} onChange={(e)=>change(key,e.target.value)}/>{errors[key]&&<span className="field-error">{errors[key]}</span>}</div>)}{isNew&&<div className="form-field"><label htmlFor="user-password">Mật khẩu *</label><input id="user-password" type="password" value={form.password} onChange={(e)=>change("password",e.target.value)}/>{errors.password&&<span className="field-error">{errors.password}</span>}</div>}{isNew&&can(me,"roles:assign")&&<fieldset><legend>Vai trò</legend>{roles.map(role=>{const missing=role.permissions.filter(permission=>!me.permissions.includes(permission));return <label className="check" key={role.id}><input type="checkbox" checked={form.roleIds.includes(role.id)} disabled={missing.length>0} onChange={()=>toggleRole(role.id)}/><span><b>{role.name}</b> <span className="muted">({role.code}){missing.length>0&&" — vượt quyền của bạn"}</span></span></label>})}</fieldset>}<div className="modal-actions"><button type="button" onClick={onClose}>Hủy</button><button className="primary" disabled={saving}>{saving?"Đang lưu…":"Lưu"}</button></div></form></Modal>}
    function RoleAssignModal({user,roles,me,notify,onClose,onSaved}){const initial=user.roles.map(role=>String(role.id));const[selected,setSelected]=useState(initial);const[saving,setSaving]=useState(false);const self=sameId(user.id,me.id);const toggle=(id)=>setSelected(selected.includes(id)?selected.filter(item=>item!==id):[...selected,id]);const save=async()=>{const add=selected.filter(id=>!initial.includes(id));const remove=initial.filter(id=>!selected.includes(id));const operations=[...add.map(id=>({id,verb:"gán",run:()=>api.put(`/users/${user.id}/roles/${id}`)})),...remove.map(id=>({id,verb:"gỡ",run:()=>api.delete(`/users/${user.id}/roles/${id}`)}))];if(!operations.length)return onClose();setSaving(true);const results=await Promise.allSettled(operations.map(item=>item.run()));setSaving(false);const failed=results.map((result,index)=>({result,operation:operations[index]})).filter(item=>item.result.status==="rejected").map(({result,operation})=>`Không thể ${operation.verb} "${roles.find(role=>sameId(role.id,operation.id))?.name}": ${result.reason.message}`);notify(failed.length?"error":"success",failed.length?failed.join(" "):`Đã cập nhật vai trò cho ${user.fullName}.`);onSaved()};return <Modal title={`Vai trò của ${user.fullName}`} onClose={onClose}>{roles.map(role=>{const id=String(role.id);const missing=role.permissions.filter(permission=>!me.permissions.includes(permission));const lockedSelf=self&&initial.includes(id);return <label className="check" key={id}><input type="checkbox" checked={selected.includes(id)} disabled={missing.length>0||lockedSelf} onChange={()=>toggle(id)}/><span><b>{role.name}</b> <span className="muted">({role.code}, {role.permissions.length} quyền){missing.length>0&&" — vượt quyền của bạn"}{lockedSelf&&" — không thể tự gỡ"}</span></span></label>})}<div className="modal-actions"><button onClick={onClose}>Hủy</button><button className="primary" onClick={save} disabled={saving}>{saving?"Đang lưu…":"Lưu"}</button></div></Modal>}
    function UsersPage({me,notify,reloadMe}){const[users,setUsers]=useState([]);const[meta,setMeta]=useState({page:1,limit:5,totalItems:0,totalPages:1});const[page,setPage]=useState(1);const[limit,setLimit]=useState(5);const[search,setSearch]=useState("");const[status,setStatus]=useState("");const[roleId,setRoleId]=useState("");const[roles,setRoles]=useState([]);const[editing,setEditing]=useState(undefined);const[assigning,setAssigning]=useState(null);const handleError=useCallback((err)=>{notify("error",err.message);if(err.status===403)reloadMe()},[notify,reloadMe]);const fetchUsers=useCallback(async()=>{const params={page,limit,sort:"-createdAt"};if(search.trim().length>=2)params.q=search.trim();if(status)params.status=status;if(roleId)params.roleId=roleId;try{const{data}=await api.get("/users",{params});setUsers(data.data);setMeta(data.meta);if(page>data.meta.totalPages)setPage(data.meta.totalPages)}catch(err){handleError(err)}},[page,limit,search,status,roleId,handleError]);useEffect(()=>{fetchUsers()},[fetchUsers]);useEffect(()=>{if(!can(me,"roles:read"))return;(async()=>{try{const{data}=await api.get("/roles",{params:{limit:100}});setRoles(data.data)}catch(err){handleError(err)}})()},[me,handleError]);const changeFilter=(setter)=>(value)=>{setter(value);setPage(1)};const toggleLock=async(user)=>{try{await api.patch(`/users/${user.id}`,{status:user.status==="locked"?"active":"locked"});notify("success",user.status==="locked"?"Đã mở khóa người dùng.":"Đã khóa người dùng.");fetchUsers()}catch(err){handleError(err)}};const remove=async(user)=>{if(!confirm(`Bạn có chắc muốn xóa "${user.fullName}"?`))return;try{await api.delete(`/users/${user.id}`);notify("success","Đã xóa người dùng.");fetchUsers()}catch(err){handleError(err)}};return <div className="card"><div className="toolbar"><SearchBar onSearch={changeFilter(setSearch)}/><select aria-label="Lọc trạng thái" value={status} onChange={(e)=>changeFilter(setStatus)(e.target.value)}><option value="">Mọi trạng thái</option><option value="active">Hoạt động</option><option value="locked">Đã khóa</option></select>{can(me,"roles:read")&&<select aria-label="Lọc vai trò" value={roleId} onChange={(e)=>changeFilter(setRoleId)(e.target.value)}><option value="">Mọi vai trò</option>{roles.map(role=><option key={role.id} value={role.id}>{role.name}</option>)}</select>}{can(me,"users:create")&&<button className="primary" onClick={()=>setEditing(null)}>+ Thêm người dùng</button>}</div><UserTable users={users} me={me} offset={(meta.page-1)*meta.limit} onEdit={setEditing} onAssign={setAssigning} onToggleLock={toggleLock} onDelete={remove}/><Pagination meta={meta} limit={limit} onPageChange={setPage} onLimitChange={changeFilter(setLimit)}/>{editing!==undefined&&<UserModal user={editing} roles={roles} me={me} notify={notify} onClose={()=>setEditing(undefined)} onSaved={()=>{setEditing(undefined);fetchUsers()}}/>}{assigning&&<RoleAssignModal user={assigning} roles={roles} me={me} notify={notify} onClose={()=>setAssigning(null)} onSaved={()=>{setAssigning(null);fetchUsers()}}/>}</div>}
    function RoleModal({role,catalog,me,notify,onClose,onSaved}){const isNew=!role;const[form,setForm]=useState({code:role?.code||"",name:role?.name||"",description:role?.description||"",permissions:role?.permissions||[]});const[errors,setErrors]=useState({});const[saving,setSaving]=useState(false);const groups=catalog.reduce((out,item)=>({...out,[item.resource]:[...(out[item.resource]||[]),item]}),{});const change=(key,value)=>{setForm({...form,[key]:value});if(errors[key])setErrors({...errors,[key]:""})};const toggle=(code)=>change("permissions",form.permissions.includes(code)?form.permissions.filter(item=>item!==code):[...form.permissions,code]);const submit=async(e)=>{e.preventDefault();const next={};if(isNew&&!/^[a-z][a-z0-9-]{2,49}$/.test(form.code))next.code="Mã phải có 3–50 ký tự và đúng định dạng.";if(form.name.trim().length<2)next.name="Tên phải có ít nhất 2 ký tự.";if(Object.keys(next).length)return setErrors(next);setSaving(true);try{if(isNew)await api.post("/roles",{code:form.code.trim(),name:form.name.trim(),description:form.description.trim()||null,permissions:form.permissions});else{const patch={};if(form.name.trim()!==role.name)patch.name=form.name.trim();if((form.description.trim()||null)!==(role.description||null))patch.description=form.description.trim()||null;if(Object.keys(patch).length)await api.patch(`/roles/${role.id}`,patch);const changed=form.permissions.length!==role.permissions.length||form.permissions.some(item=>!role.permissions.includes(item));if(!role.isSystem&&changed)await api.put(`/roles/${role.id}/permissions`,{permissions:form.permissions})}notify("success",isNew?"Tạo vai trò thành công.":"Cập nhật vai trò thành công.");onSaved()}catch(err){const field={};err.details.forEach(item=>{if(item.field)field[item.field]=item.message});if(err.code==="ROLE_CODE_EXISTS")field.code=err.message;setErrors(field);if(!Object.keys(field).length)notify("error",err.message)}finally{setSaving(false)}};return <Modal title={isNew?"Thêm vai trò":"Sửa vai trò"} onClose={onClose}><form onSubmit={submit}>{isNew&&<div className="form-field"><label htmlFor="role-code">Mã vai trò *</label><input id="role-code" value={form.code} onChange={(e)=>change("code",e.target.value)}/>{errors.code&&<span className="field-error">{errors.code}</span>}</div>}<div className="form-field"><label htmlFor="role-name">Tên vai trò *</label><input id="role-name" value={form.name} onChange={(e)=>change("name",e.target.value)}/>{errors.name&&<span className="field-error">{errors.name}</span>}</div><div className="form-field"><label htmlFor="role-description">Mô tả</label><textarea id="role-description" rows="3" value={form.description} onChange={(e)=>change("description",e.target.value)}/></div><fieldset><legend>Quyền</legend>{Object.entries(groups).map(([resource,items])=><div className="permission-group" key={resource}><h4>{resource}</h4>{items.map(item=>{const outside=!me.permissions.includes(item.code);return <label className="check" key={item.code}><input type="checkbox" checked={form.permissions.includes(item.code)} disabled={role?.isSystem||outside} onChange={()=>toggle(item.code)}/><span><b>{item.code}</b><br/><span className="muted">{item.description}{outside&&" — bạn không có quyền này"}</span></span></label>})}</div>)}</fieldset>{errors.permissions&&<p className="field-error">{errors.permissions}</p>}<div className="modal-actions"><button type="button" onClick={onClose}>Hủy</button><button className="primary" disabled={saving}>{saving?"Đang lưu…":"Lưu"}</button></div></form></Modal>}
    function RolesPage({me,notify,reloadMe}){const[roles,setRoles]=useState([]);const[catalog,setCatalog]=useState([]);const[editing,setEditing]=useState(undefined);const[loading,setLoading]=useState(true);const load=useCallback(async()=>{setLoading(true);try{const requests=[api.get("/roles",{params:{limit:100}}),can(me,"permissions:read")?api.get("/permissions"):Promise.resolve({data:{data:[]}})];const[roleResponse,permissionResponse]=await Promise.all(requests);setRoles(roleResponse.data.data);setCatalog(permissionResponse.data.data)}catch(err){notify("error",err.message);if(err.status===403)reloadMe()}finally{setLoading(false)}},[me,notify,reloadMe]);useEffect(()=>{load()},[load]);const remove=async(role)=>{if(!confirm(`Bạn có chắc muốn xóa vai trò "${role.name}"?`))return;try{await api.delete(`/roles/${role.id}`);notify("success","Đã xóa vai trò.");load()}catch(err){notify("error",err.message)}};const saved=async()=>{setEditing(undefined);await load();await reloadMe()};if(loading)return <div className="card loading">Đang tải vai trò…</div>;return <div className="card"><div className="toolbar"><div style={{flex:1}}><b>Danh sách vai trò</b><div className="muted">Quyền được nhóm theo tài nguyên</div></div>{can(me,"roles:create")&&can(me,"permissions:read")&&<button className="primary" onClick={()=>setEditing(null)}>+ Thêm vai trò</button>}</div><div className="table-wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Quyền</th><th>Người dùng</th><th>Loại</th><th>Thao tác</th></tr></thead><tbody>{roles.map(role=><tr key={role.id}><td><b>{role.code}</b></td><td>{role.name}<div className="muted">{role.description}</div></td><td>{role.permissions.map(item=><span className="badge" key={item}>{item}</span>)}</td><td>{role.userCount}</td><td><span className={`badge ${role.isSystem?"system":""}`}>{role.isSystem?"Hệ thống":"Tùy chỉnh"}</span></td><td><div className="actions">{can(me,"roles:update")&&can(me,"permissions:read")&&<button onClick={()=>setEditing(role)}>Sửa</button>}{can(me,"roles:delete")&&!role.isSystem&&<button className="danger" onClick={()=>remove(role)}>Xóa</button>}</div></td></tr>)}</tbody></table></div>{editing!==undefined&&<RoleModal role={editing} catalog={catalog} me={me} notify={notify} onClose={()=>setEditing(undefined)} onSaved={saved}/>}</div>}
    function MyProfile({me}){return <section className="profile card"><div className="section-title"><h2>Hồ sơ của tôi</h2><span className={`badge ${me.status}`}>{me.status}</span></div><dl><dt>Họ tên</dt><dd>{me.fullName}</dd><dt>Email</dt><dd>{me.email}</dd><dt>Số điện thoại</dt><dd>{me.phone||"Chưa cập nhật"}</dd><dt>Vai trò</dt><dd>{me.roles.map(role=><span className="badge" key={role.id}>{role.name}</span>)}</dd><dt>Quyền hiệu lực</dt><dd>{me.permissions.length?me.permissions.map(item=><span className="badge" key={item}>{item}</span>):<span className="muted">Không có quyền quản trị</span>}</dd><dt>Đăng nhập gần nhất</dt><dd>{me.lastLoginAt?new Date(me.lastLoginAt).toLocaleString("vi-VN"):"—"}</dd></dl></section>}
    function App(){const[me,setMe]=useState(null);const[checking,setChecking]=useState(!!getToken());const[tab,setTab]=useState("users");const[toast,setToast]=useState(null);const timer=useRef(null);const notify=useCallback((type,text)=>{setToast({type,text});clearTimeout(timer.current);timer.current=setTimeout(()=>setToast(null),4000)},[]);const loadMe=useCallback(async()=>{const{data}=await api.get("/me");setMe(data);return data},[]);useEffect(()=>{if(!getToken()){setChecking(false);return}loadMe().catch(()=>{}).finally(()=>setChecking(false))},[loadMe]);useEffect(()=>{const expired=()=>{setMe(null);notify("error","Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.")};window.addEventListener("auth:expired",expired);return()=>window.removeEventListener("auth:expired",expired)},[notify]);useEffect(()=>{const refresh=()=>{if(getToken())loadMe().catch(()=>{})};window.addEventListener("auth:forbidden",refresh);return()=>window.removeEventListener("auth:forbidden",refresh)},[loadMe]);useEffect(()=>()=>clearTimeout(timer.current),[]);const logout=()=>{setToken(null);setMe(null)};if(checking)return <div className="loading">Đang tải…</div>;const tabs=[can(me,"users:read")&&{key:"users",label:"Người dùng"},can(me,"roles:read")&&{key:"roles",label:"Vai trò"},me&&{key:"me",label:"Hồ sơ của tôi"}].filter(Boolean);const current=tabs.some(item=>item.key===tab)?tab:tabs[0]?.key;return <div className="container">{!me?<LoginPage onLoggedIn={loadMe}/>:<><header className="header"><div><h1>Quản lý Người dùng &amp; Phân quyền</h1><div className="muted">{me.fullName} ({me.email}) · {me.roles.map(role=><span className="badge" key={role.id}>{role.name}</span>)}</div></div><button onClick={logout}>Đăng xuất</button></header><nav className="tabs" aria-label="Điều hướng chính">{tabs.map(item=><button key={item.key} className={current===item.key?"active":""} onClick={()=>setTab(item.key)}>{item.label}</button>)}</nav><main>{current==="users"&&<UsersPage me={me} notify={notify} reloadMe={loadMe}/>} {current==="roles"&&<RolesPage me={me} notify={notify} reloadMe={loadMe}/>} {current==="me"&&<MyProfile me={me}/>}</main></>}{toast&&<div className={`toast ${toast.type}`} role="status">{toast.text}</div>}</div>}
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
